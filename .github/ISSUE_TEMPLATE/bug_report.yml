name: Bug report
description: Something in Ostia does not work as intended
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search the [existing issues](https://github.com/aurigax-ai/ostia/issues?q=is%3Aissue) first. For a security problem, do not open an issue: follow the [security policy](https://github.com/aurigax-ai/.github/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Ostia version
      description: Run `ostia --version` in a terminal, or on macOS choose Ostia > About Ostia.
      placeholder: "0.5.9"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Arch Linux or CachyOS
        - Debian or Ubuntu
        - Other Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "macOS 26.0, Ubuntu 24.04"
  - type: dropdown
    id: install
    attributes:
      label: How you installed Ostia
      options:
        - Homebrew (brew install --cask)
        - dmg from GitHub Releases
        - APT repository
        - .deb from GitHub Releases
        - tar.gz from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant lines. Remove tokens, passwords, host names and paths you do not want to share.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drop images here if they help.
  - type: input
    id: extensions
    attributes:
      label: Extensions installed
      description: The extensions you installed from a marketplace, or "none".
  - type: checkboxes
    id: searched
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this has not been reported.
          required: true
